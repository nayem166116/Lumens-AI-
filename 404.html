/* ============================================================
   LUMENS AI — DESIGN TOKENS
   Style: #37 Bold Serif Editorial (custom style, out-of-library)
   Layout: Blueprint 28 — Double Rail
   Scale: Standard · Density: Calm
   ============================================================ */
:root{
  /* ---- Brand tokens (from INPUT BLOCK) ---- */
  --color-primary:#0EA5E9;      /* accent — links, active state, signature waveform */
  --color-secondary:#14181F;    /* ink — near-black text */
  --color-accent:#F59E0B;       /* rare highlight-marker use only */
  --surface-optional-1:#F6F8FA; /* paper surface */
  --neutral-optional-2:#6E7681; /* secondary ink */

  /* ---- Neutral ramp (derived, named) ---- */
  --paper:#FFFFFF;              /* Paper — canvas */
  --paper-soft:var(--surface-optional-1); /* Paper Soft — recessed surface */
  --ink:var(--color-secondary); /* Ink — primary text */
  --ink-muted:var(--neutral-optional-2); /* Ink Muted — secondary text */
  --ink-faint:#A4A9AF;          /* Ink Faint — tertiary / placeholder */
  --rule:#E3E1DC;               /* Rule — hairline borders */
  --rule-strong:#C9C6BF;        /* Rule Strong — emphasised hairline */
  --accent:var(--color-primary);
  --accent-ink:#063A54;         /* Accent Ink — accent text on light */
  --mark:var(--color-accent);   /* Mark — highlighter */
  --mark-soft:#FDECC8;
  --success:#2E7D5B;
  --success-soft:#E7F3EC;
  --danger:#C1432B;
  --danger-soft:#FBEAE5;

  /* ---- Typography ---- */
  --font-display:Georgia,'Iowan Old Style','Palatino Linotype','URW Palladio L',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:Menlo,Consolas,'Liberation Mono',monospace;

  --fs-body:16px;
  --lh-body:1.6;
  --lh-heading:1.15;
  --fs-h3:20px;
  --fs-h2:26px;
  --fs-h1:clamp(1.9rem,4.6vw,3.2rem);
  --fs-kicker:12px;
  --tracking-kicker:0.14em;

  /* ---- Spacing (4px grid) ---- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px;
  --sp-8:32px; --sp-12:48px; --sp-16:64px; --sp-20:80px; --sp-24:96px;

  --container-max:1280px;
  --gutter:clamp(20px,4vw,40px);
  --section-pad-y:clamp(56px,8vw,112px);

  --rail-left-w:264px;
  --rail-right-w:272px;

  /* ---- Controls (Standard scale) ---- */
  --control-h:42px;
  --btn-h:42px;
  --radius:0px; /* editorial style: sharp corners, no rounding */
  --border-w:1px;

  /* ---- Motion (Editorial character: measured, near-instant, rare overshoot on signature only) ---- */
  --dur-fast:180ms;
  --dur-med:320ms;
  --dur-slow:520ms;
  --ease-out-premium:cubic-bezier(0.16,1,0.3,1);
  --ease-in-premium:cubic-bezier(0.7,0,0.84,0);
  --ease-instant:cubic-bezier(0.2,0,0,1);
}

@media (max-width:900px){
  :root{ --section-pad-y:clamp(40px,10vw,64px); }
}

<style>
/* ============================================================
   BASE — reset, typography, Double Rail shell
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }
body{

  font-family:var(--font-body);

.measure{ max-width:72ch; }

/* ---------------- Mobile top bar (hidden on desktop) ---------------- */
.mobile-bar{

}
.mobile-bar .wordmark{ font-family:var(--font-display); font-weight:700; font-size:18px; }
.mobile-bar button{ background:none;border:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer; }

/* ---------------- Shell (Double Rail) ---------------- */
.shell{

  max-width:1680px;
  margin:0 auto;
}

.rail{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  padding:var(--sp-8) var(--sp-6);

}
.rail-left{ border-right:var(--border-w) solid var(--rule); }
.rail-right{ border-left:var(--border-w) solid var(--rule); }

.rail-wordmark{

.nav-group{ margin-bottom:var(--sp-6); }
.nav-group-label{

  font-size:var(--fs-kicker); letter-spacing:var(--tracking-kicker); text-transform:uppercase;
  color:var(--ink-muted); font-weight:700; margin-bottom:var(--sp-2);
}
.nav-group-label i{ font-size:10px; transition:transform var(--dur-fast) var(--ease-instant); }
.nav-group.is-collapsed .nav-group-label i{ transform:rotate(-90deg); }
.nav-group.is-collapsed .nav-list{ display:none; }
.nav-list a{

}
.nav-list a:hover{ color:var(--accent-ink); }
.nav-list a[aria-current="page"]{ color:var(--accent-ink); border-left-color:var(--accent); font-weight:700; }

.rail-cta{
  display:block; margin-top:var(--sp-4); text-align:center; padding:var(--sp-3);
  border:var(--border-w) solid var(--ink); font-size:13px; font-weight:700;
}
.rail-cta:hover{ background:var(--ink); color:var(--paper); }

/* -------- On this page (right rail) -------- */
.toc-label{ font-size:var(--fs-kicker); letter-spacing:var(--tracking-kicker); text-transform:uppercase; color:var(--ink-muted); font-weight:700; margin-bottom:var(--sp-3); }
.toc-list a{
  display:block; padding:var(--sp-1) 0; font-size:13.5px; color:var(--ink-muted);
  border-left:2px solid var(--rule); padding-left:var(--sp-3);
}
.toc-list a.is-active{ color:var(--accent-ink); border-left-color:var(--accent); font-weight:600; }
.side-note{
  margin-top:var(--sp-8); padding-top:var(--sp-6); border-top:var(--border-w) solid var(--rule);
  font-size:13.5px; color:var(--ink-muted);
}
.side-note strong{ display:block; color:var(--ink); font-family:var(--font-display); font-size:15px; margin-bottom:var(--sp-2); }

/* -------- Middle content column -------- */
.content{ padding:var(--sp-8) clamp(24px,5vw,64px); min-width:0; }

.page-header{ padding-bottom:var(--sp-8); margin-bottom:var(--sp-8); border-bottom:var(--border-w) solid var(--rule); }
.page-header h1{ margin:var(--sp-3) 0 var(--sp-4); }
.page-header .lede{ font-size:18px; color:var(--ink-muted); max-width:62ch; }
.page-meta{ margin-top:var(--sp-4); font-size:13px; color:var(--ink-faint); display:flex; gap:var(--sp-4); flex-wrap:wrap; }

.doc-section{ padding:var(--sp-12) 0; border-bottom:var(--border-w) solid var(--rule); }
.doc-section:last-of-type{ border-bottom:none; }
.doc-section-head{ display:grid; grid-template-columns:64px 1fr; gap:var(--sp-6); margin-bottom:var(--sp-6); align-items:baseline; }
.doc-section-num{ font-family:var(--font-display); font-size:34px; color:var(--rule-strong); font-weight:700; }
.doc-section-body{ padding-left:0; }
.doc-section-body > * + *{ margin-top:var(--sp-4); }
.doc-section p{ color:var(--ink); }
.doc-section p.lede{ font-size:17px; color:var(--ink-muted); }

@media (max-width:900px){
  .doc-section-head{ grid-template-columns:40px 1fr; }
  .doc-section-num{ font-size:24px; }
}

/* -------- Prev/Next + footer legal row -------- */
.page-nav{ display:flex; justify-content:space-between; gap:var(--sp-4); margin-top:var(--sp-12); padding-top:var(--sp-8); border-top:var(--border-w) solid var(--rule); }
.page-nav a{ max-width:46%; }
.page-nav .dir{ display:block; font-size:12px; letter-spacing:var(--tracking-kicker); text-transform:uppercase; color:var(--ink-faint); margin-bottom:var(--sp-1); }
.page-nav .title{ font-family:var(--font-display); font-size:17px; font-weight:700; }
.page-nav .next{ text-align:right; margin-left:auto; }

.site-footer-legal{
  margin-top:var(--sp-12); padding-top:var(--sp-6); border-top:var(--border-w) solid var(--rule);
  display:flex; flex-wrap:wrap; gap:var(--sp-2) var(--sp-6); align-items:center;
  font-size:13px; color:var(--ink-faint);
}
.site-footer-legal a{ color:var(--ink-muted); }
.site-footer-legal a:hover{ color:var(--accent-ink); }

/* ---------------- Mobile layout ---------------- */
@media (max-width:900px){
  .mobile-bar{ display:flex; }
  .shell{ display:block; }
  .rail-left{
    position:fixed; inset:0 30% 0 0; height:100vh; z-index:100;

  .rail-left.is-open{ transform:translateX(0); }

  }
  .rail-scrim.is-open{ display:block; }
  .rail-right{ position:static; height:auto; border-left:none; border-top:var(--border-w) solid var(--rule); padding:var(--sp-4) var(--gutter); }
  .content{ padding:var(--sp-6) var(--gutter); }
  .toc-panel{ display:none; }

  }
  .page-nav{ flex-direction:column; }
  .page-nav a{ max-width:100%; }
  .page-nav .next{ text-align:left; }
}
@media (min-width:901px){
  .toc-toggle{ display:none; }
}

<style>
/* ============================================================
   COMPONENTS — buttons, forms, callouts, tables, OTP, cookie banner
   Editorial style: sharp corners, hairline rules, no shadow, no pills
   ============================================================ */

/* -------- Buttons: two-cell (label | icon divided by hairline) -------- */
.btn{
  display:inline-flex; align-items:stretch; height:var(--btn-h); border:var(--border-w) solid var(--ink);
  font-weight:700; font-size:14px; cursor:pointer; background:var(--paper); color:var(--ink);
  transition:background var(--dur-fast) var(--ease-instant), color var(--dur-fast) var(--ease-instant);
}
.btn span{ display:flex; align-items:center; padding:0 var(--sp-4); }
.btn i{ display:flex; align-items:center; justify-content:center; width:40px; border-left:var(--border-w) solid currentColor; }
.btn:hover{ background:var(--ink); color:var(--paper); }
.btn:disabled,.btn[aria-disabled="true"]{ opacity:0.45; cursor:not-allowed; }
.btn:disabled:hover,.btn[aria-disabled="true"]:hover{ background:var(--paper); color:var(--ink); }

.btn-primary{ border-color:var(--accent-ink); background:var(--ink); color:var(--paper); }
.btn-primary:hover{ background:var(--accent-ink); }
.btn-primary i{ border-left-color:rgba(255,255,255,0.3); }

.btn-text{
  display:inline-block; border:none; height:auto; background:none; padding:0;
  font-weight:700; font-size:14px; color:var(--accent-ink); position:relative; cursor:pointer;
}
.btn-text::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px; height:1px; background:currentColor;
  transform:scaleX(0); transform-origin:right; transition:transform var(--dur-fast) var(--ease-out-premium);
}
.btn-text:hover::after{ transform:scaleX(1); transform-origin:left; }
.btn-block{ width:100%; justify-content:center; }

/* -------- Forms -------- */
.field{ margin-bottom:var(--sp-6); }
.field label{ display:block; font-size:13px; font-weight:700; margin-bottom:var(--sp-2); }
.field .hint{ font-size:12.5px; color:var(--ink-faint); margin-top:var(--sp-1); }
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=tel],.field textarea{
  width:100%; height:var(--control-h); border:var(--border-w) solid var(--rule-strong); background:var(--paper);
  padding:0 var(--sp-3); font-size:16px; color:var(--ink);
  transition:border-color var(--dur-fast) var(--ease-instant);
}
.field textarea{ height:auto; padding:var(--sp-3); resize:vertical; min-height:120px; }
.field input:focus,.field textarea:focus{ border-color:var(--accent); }
.field.has-error input,.field.has-error textarea{ border-color:var(--danger); }
.field .error-msg{ display:none; color:var(--danger); font-size:12.5px; margin-top:var(--sp-1); font-weight:600; }
.field.has-error .error-msg{ display:block; }

.checkbox-row{ display:flex; align-items:flex-start; gap:var(--sp-2); font-size:13.5px; color:var(--ink-muted); }
.checkbox-row input{ margin-top:3px; width:16px; height:16px; }
.checkbox-row a{ color:var(--accent-ink); font-weight:600; }

.password-toggle{ position:relative; }
.password-toggle button{ position:absolute; right:0; top:0; height:var(--control-h); width:40px; background:none; border:none; cursor:pointer; color:var(--ink-muted); }

.strength-meter{ display:flex; gap:4px; margin-top:var(--sp-2); }
.strength-meter span{ height:3px; flex:1; background:var(--rule); }
.strength-meter.weak span:nth-child(1){ background:var(--danger); }
.strength-meter.fair span:nth-child(1),.strength-meter.fair span:nth-child(2){ background:var(--color-accent,var(--accent)); }
.strength-meter.strong span{ background:var(--success); }
.strength-label{ font-size:12px; color:var(--ink-faint); margin-top:var(--sp-1); display:block; }

.checklist{ margin-top:var(--sp-2); font-size:12.5px; color:var(--ink-faint); }
.checklist li{ display:flex; align-items:center; gap:6px; padding:2px 0; }
.checklist li i{ width:12px; color:var(--rule-strong); }
.checklist li.is-met{ color:var(--success); }
.checklist li.is-met i{ color:var(--success); }

/* -------- Alerts / callouts -------- */
.callout{ border-left:3px solid var(--ink); padding:var(--sp-4) var(--sp-5); background:var(--paper-soft); }
.callout.callout-accent{ border-left-color:var(--accent); }
.callout.callout-danger{ border-left-color:var(--danger); background:var(--danger-soft); }
.callout.callout-success{ border-left-color:var(--success); background:var(--success-soft); }
.callout .kicker{ margin-bottom:var(--sp-1); }

.form-alert{
  display:none; align-items:flex-start; gap:var(--sp-3); padding:var(--sp-4); margin-bottom:var(--sp-6);
  border-left:3px solid var(--danger); background:var(--danger-soft); font-size:14px;
}
.form-alert.is-visible{ display:flex; }
.form-alert i{ margin-top:2px; color:var(--danger); }
.form-alert strong{ display:block; margin-bottom:2px; }
.form-alert p{ margin:0; color:var(--ink-muted); font-size:13.5px; }
.form-alert a{ color:var(--accent-ink); font-weight:700; }

.form-alert.is-shaking{ animation:shake 420ms var(--ease-instant); }
@keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
@media (prefers-reduced-motion:reduce){ .form-alert.is-shaking{ animation:none; } }

/* -------- Tables (definition/matrix style, not card grids) -------- */
table.matrix{ width:100%; border-collapse:collapse; font-size:14.5px; }
table.matrix caption{ text-align:left; margin-bottom:var(--sp-3); }
table.matrix th,table.matrix td{ padding:var(--sp-3) var(--sp-4); border-bottom:var(--border-w) solid var(--rule); text-align:left; vertical-align:top; }
table.matrix thead th{ font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-muted); border-bottom:var(--border-w) solid var(--ink); }
table.matrix tbody tr:hover{ background:var(--paper-soft); }
table.matrix td.is-yes{ color:var(--success); font-weight:700; }
table.matrix td.is-no{ color:var(--ink-faint); }
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* -------- Definition list rows (used instead of icon+circle card grids) -------- */
.dl-rows{ border-top:var(--border-w) solid var(--rule); }
.dl-row{ display:grid; grid-template-columns:220px 1fr; gap:var(--sp-6); padding:var(--sp-6) 0; border-bottom:var(--border-w) solid var(--rule); }
.dl-row dt{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.dl-row dd{ margin:0; color:var(--ink-muted); }
@media (max-width:640px){ .dl-row{ grid-template-columns:1fr; gap:var(--sp-2); } }

/* -------- List rows for use-cases / plans (hairline separated, no card boxes) -------- */
.list-rows{ }
.list-row{ display:grid; grid-template-columns:1fr 2fr; gap:var(--sp-8); padding:var(--sp-8) 0; border-bottom:var(--border-w) solid var(--rule); }
.list-row:first-child{ border-top:var(--border-w) solid var(--rule); }
.list-row .num{ font-family:var(--font-display); font-size:15px; color:var(--ink-faint); }
@media (max-width:768px){ .list-row{ grid-template-columns:1fr; gap:var(--sp-3); } }

/* -------- Blockquote (proof / testimonial — not avatar-star card) -------- */
blockquote.quote{ margin:0; padding-left:var(--sp-6); border-left:3px solid var(--ink); }
blockquote.quote p{ font-family:var(--font-display); font-size:22px; line-height:1.4; }
blockquote.quote cite{ display:block; margin-top:var(--sp-3); font-style:normal; font-size:13.5px; color:var(--ink-muted); }

/* -------- Mark (highlighter, accent color, sparing use) -------- */
mark.hl{ background:var(--mark-soft); color:var(--ink); padding:0 3px; }

/* -------- OTP input -------- */
.otp-row{ display:flex; gap:var(--sp-2); }
.otp-row input{
  width:48px; height:56px; text-align:center; font-size:22px; font-family:var(--font-display);
  border:var(--border-w) solid var(--rule-strong); background:var(--paper);
}
.otp-row input:focus{ border-color:var(--accent); }
@media (max-width:420px){ .otp-row input{ width:40px; height:48px; font-size:18px; } }

.countdown{ font-size:13.5px; color:var(--ink-muted); margin-top:var(--sp-4); }
.countdown strong{ color:var(--ink); }

/* -------- Auth record frame (replaces generic centered card) -------- */
.auth-frame{ max-width:440px; }
.auth-frame .doc-section-num{ font-size:28px; }

/* -------- Spinner (used inside buttons, minimal) -------- */
.spinner{ width:14px; height:14px; border:2px solid rgba(255,255,255,0.35); border-top-color:#fff; border-radius:50%; display:inline-block; animation:spin 700ms linear infinite; margin-right:8px; vertical-align:-2px; }
.btn:not(.btn-primary) .spinner{ border-color:rgba(20,24,31,0.25); border-top-color:var(--ink); }
@keyframes spin{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce){ .spinner{ animation-duration:1400ms; } }

/* -------- Loading page indicator -------- */
.loading-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:var(--sp-4); background:var(--paper); }
.loading-bar{ width:180px; height:2px; background:var(--rule); position:relative; overflow:hidden; }
.loading-bar::after{ content:""; position:absolute; top:0; bottom:0; width:40%; background:var(--ink); animation:loadingSlide 1.3s var(--ease-instant) infinite; }
@keyframes loadingSlide{ 0%{ left:-40%; } 100%{ left:100%; } }

/* -------- Cookie banner -------- */
.cookie-banner{
  position:fixed; left:0; right:0; bottom:0; z-index:150; background:var(--ink); color:var(--paper);
  padding:var(--sp-5) var(--gutter); display:flex; gap:var(--sp-6); align-items:center; justify-content:space-between;
  transform:translateY(100%); transition:transform var(--dur-med) var(--ease-out-premium);
  flex-wrap:wrap;
}
.cookie-banner.is-visible{ transform:translateY(0); }
.cookie-banner p{ font-size:13.5px; color:rgba(255,255,255,0.8); max-width:60ch; margin:0; }
.cookie-banner .actions{ display:flex; gap:var(--sp-3); flex-wrap:wrap; }
.cookie-banner .btn{ border-color:rgba(255,255,255,0.4); color:var(--paper); background:transparent; height:38px; }
.cookie-banner .btn:hover{ background:rgba(255,255,255,0.12); color:var(--paper); }
.cookie-banner .btn-primary{ background:var(--paper); color:var(--ink); border-color:var(--paper); }
.cookie-banner .btn-primary:hover{ background:var(--accent); border-color:var(--accent); color:var(--ink); }

.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,24,31,0.5); z-index:200; display:none; align-items:center; justify-content:center; padding:var(--sp-4);
  opacity:0; transition:opacity var(--dur-fast) var(--ease-instant);
}
.modal-backdrop.is-open{ display:flex; opacity:1; }
.modal{
  background:var(--paper); border:var(--border-w) solid var(--ink); max-width:520px; width:100%; padding:var(--sp-8);
  max-height:85vh; overflow-y:auto;
}
.modal h3{ margin-bottom:var(--sp-4); }
.modal-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-4); padding:var(--sp-4) 0; border-bottom:var(--border-w) solid var(--rule); }
.modal-row:last-of-type{ border-bottom:none; }
.modal-row h4{ font-family:var(--font-body); font-size:14px; font-weight:700; margin-bottom:4px; }
.modal-row p{ font-size:12.5px; color:var(--ink-muted); margin:0; }
.switch{ position:relative; width:38px; height:22px; flex-shrink:0; }
.switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; }
.switch .track{ position:absolute; inset:0; background:var(--rule-strong); transition:background var(--dur-fast); }
.switch .thumb{ position:absolute; top:2px; left:2px; width:18px; height:18px; background:var(--paper); transition:transform var(--dur-fast) var(--ease-out-premium); }
.switch input:checked + .track{ background:var(--accent-ink); }
.switch input:checked ~ .thumb{ transform:translateX(16px); }
.switch input:disabled + .track{ opacity:0.5; }
.modal-actions{ display:flex; gap:var(--sp-3); margin-top:var(--sp-6); justify-content:flex-end; }

/* -------- Progress bar (page transitions) -------- */
#top-progress{ position:fixed; top:0; left:0; height:2px; background:var(--accent); width:0%; z-index:300; transition:width 200ms var(--ease-out-premium), opacity 200ms; }

/* -------- Free tool -------- */
.tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-8); align-items:start; }
@media (max-width:900px){ .tool-grid{ grid-template-columns:1fr; } }
.tool-result{ border:var(--border-w) solid var(--rule-strong); padding:var(--sp-6); min-height:220px; }
.tool-result .placeholder{ color:var(--ink-faint); font-size:14px; }
.shimmer{ background:linear-gradient(90deg,var(--paper-soft) 25%,var(--rule) 37%,var(--paper-soft) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; height:14px; margin-bottom:var(--sp-3); }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
@media (prefers-reduced-motion:reduce){ .shimmer{ animation:none; opacity:0.6; } }
.score-row{ display:flex; align-items:baseline; gap:var(--sp-3); margin-bottom:var(--sp-4); }
.score-row .score{ font-family:var(--font-display); font-size:44px; font-weight:700; }
.flag-row{ display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) 0; font-size:13.5px; }
.flag-row i{ width:14px; }
.flag-row.ok i{ color:var(--success); }
.flag-row.warn i{ color:var(--color-accent,var(--accent)); }

</style>
<style>

.signature-strip{ display:flex; align-items:center; gap:2px; height:28px; margin:var(--sp-2) 0 var(--sp-6); }

.four-oh-four{ min-height:100vh; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:var(--sp-12) clamp(24px,8vw,120px); }
